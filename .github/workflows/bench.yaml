name: Benchmarks

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  rebench:
    name: Run and report benchmarks
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout master branch
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Install stable toolchain
        run: rustup default stable
      - name: Compile SOM interpreter
        run: cargo build --release -p som-interpreter-ast -p som-interpreter-bc
      - name: Install ReBench
        run: |
          pip install setuptools
          pip install wheel
          pip install rebench
      - name: Run and report benchmarks
        run: |
          export PATH="${PATH}:${HOME}/.local/bin"
          rebench --experiment="CI Benchmark Run ID ${GITHUB_RUN_ID}" --branch="${GITHUB_REF}" -c rebench.conf som-rs
